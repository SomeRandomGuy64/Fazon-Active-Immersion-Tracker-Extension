<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Active Immersion Tracker</title>
<script src="../ui/theme-boot.js"></script>
<link rel="stylesheet" href="../ui/theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="pp-head">
  <a class="pp-brand" href="https://fazon.nexus/" target="_blank" rel="noopener" title="fazon.nexus">
    <svg class="pp-logo" viewBox="0 0 128 128" aria-hidden="true"><rect x="4" y="4" width="120" height="120" rx="28" fill="var(--fz-accent)"/><path d="M64 22 A42 42 0 1 1 22 64" fill="none" stroke="#fff" stroke-opacity="0.92" stroke-width="10" stroke-linecap="round"/><path d="M22 64 A42 42 0 0 1 64 22" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/><path d="M54 44.5 L85 64 L54 83.5 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>
    <span class="pp-brand-t"><b>Active Immersion Tracker</b><span class="fz-wordmark">fazon<span>.</span>nexus</span></span>
  </a>
  <div class="pp-tools">
    <button type="button" class="fz-iconbtn" id="openDashboard" title="Open dashboard" aria-label="Open dashboard">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16.5h14"/><path d="M4.5 13l3.5-4 3 2.5 4.5-6"/><circle cx="15.5" cy="5.5" r="1.2" fill="currentColor" stroke="none"/></svg>
    </button>
    <button type="button" class="fz-iconbtn" id="openSettings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
    </button>
    <button type="button" class="toggle-button mini" data-theme-toggle role="switch" aria-checked="false" aria-label="Light mode">
      <svg class="tg-dark" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="tgm" x1="0" x2="1"><stop offset="0" stop-color="#fde38a"/><stop offset="1" stop-color="#fee3c6"/></linearGradient></defs><circle cx="12" cy="12" r="9.5" fill="url(#tgm)"/><circle cx="8.6" cy="9.2" r="2.1" fill="#fbd27a"/><circle cx="16" cy="7.6" r="1.3" fill="#fdc98f"/><circle cx="16.4" cy="13.2" r="1.3" fill="#fdc98f"/><circle cx="7.4" cy="15.3" r="1.2" fill="#fcd977"/><circle cx="12.7" cy="17.6" r="0.75" fill="#fcd977"/></svg>
      <svg class="tg-light" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="tgs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc800"/><stop offset="1" stop-color="#ff8a00"/></linearGradient></defs><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="url(#tgs)" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="12" cy="12" r="4.6" fill="url(#tgs)"/></svg>
    </button>
  </div>
</header>

<section class="pp-now" id="now" aria-live="polite">
  <div class="pp-now-top"><span class="pp-state"><span class="fz-dot"></span><span>Checking this tab…</span></span></div>
</section>

<section class="pp-today" id="today" aria-label="Today"></section>

<button type="button" class="pp-week" id="week" title="Open the dashboard"></button>

<p class="pp-err fz-error" id="err" hidden></p>

<footer class="pp-foot" id="foot"></footer>

<script type="module" src="popup.js"></script>
</body>
</html>
